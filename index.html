            /* Container Principal */

            .container {

                max-width: 900px; 

                margin: 0 auto; 

                background: white; 

                padding: 0;

                box-shadow: 0 4px 15px rgba(0,0,0,0.1); 

                border-radius: 8px; 

                overflow: hidden;

                

                /* ADICIONE ESTA LINHA ABAIXO: */

                min-height: 90vh; /* Isso força a caixa a ter pelo menos 80% da altura da tela */

            }



            /* Header */

            .morpheus-header {

                background-color: var(--ws-blue); color: white; padding: 20px;

                text-align: center; display: flex; align-items: center; justify-content: center;

                gap: 15px; border-bottom: 4px solid var(--ws-cyan);

                /* Adicione isto dentro da sua tag <style> */

            h1 { 

                margin: 0; 

                color: white; 

                font-size: 26px; /* <--- Mude este número para aumentar ou diminuir */

                text-transform: uppercase; 

                letter-spacing: 0.5px; 

            }

            }

            .morpheus-logo { 

        height: 60px; 

        background: white; 

        padding: 4px; /* Aumentei um pouco o espaço interno */

        border-radius: 5px; /* Bordas bem mais curvadas */

        box-shadow: 0 5px 15px rgba(0,0,0,0.3); /* Sombreamento suave e moderno */

        transition: transform 0.3s ease; /* (Opcional) Adiciona um efeito suave se passar o mouse */

        

    }



    /* (Opcional) Efeito extra ao passar o mouse sobre o logo */

    .morpheus-logo:hover {

        transform: translateY(-2px); /* Levanta ligeiramente o logo */

        box-shadow: 0 8px 20px rgba(0,0,0,0.4); /* Aumenta a sombra */

    }



            /* Seleção */

            .selection-panel { background: #eef2f7; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid var(--ws-cyan); }

            .row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; }

            .col { flex: 1; min-width: 180px; }

            

            /* Inputs */

            label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; font-size: 13px; }

            select, input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }

            input[readonly] { background-color: #e9ecef; cursor: not-allowed; color: #666; }



            /* --- SINALIZAÇÃO DE ERRO NOS CAMPOS --- */

            .input-error {

                border: 2px solid var(--danger-color) !important;

                background-color: #fff8f8;

                box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.15);

                transition: all 0.3s ease;

            }

            .checkbox-grid.input-error {

                border: 2px solid var(--danger-color);

                background-color: #fff8f8;

            }



        /* --- MODAL DE ERRO PROFISSIONAL (DESIGN MODERNO) --- */

            .error-modal {

                position: fixed; top: 0; left: 0; width: 100%; height: 100%;

                background: rgba(0, 0, 0, 0.65); z-index: 20000;

                display: none; justify-content: center; align-items: center;

                backdrop-filter: blur(5px);

                font-family: 'Segoe UI', Arial, sans-serif;

            }

            .error-modal-content {

                background: #fff; width: 90%; max-width: 480px;

                border-radius: 12px;

                box-shadow: 0 20px 40px rgba(0,0,0,0.3);

                overflow: hidden; 

                animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);

                border: 1px solid rgba(0,0,0,0.1);

            }

            .error-modal-header {

                background: #fff5f5; /* Fundo avermelhado suave */

                padding: 25px 30px 20px;

                display: flex; align-items: center; gap: 15px;

                border-bottom: 1px solid #ffebeb;

            }

            .error-icon-box {

                width: 42px; height: 42px;

                background: #fff; 

                color: var(--danger-color);

                border-radius: 50%;

                display: flex; align-items: center; justify-content: center;

                font-size: 22px; 

                box-shadow: 0 4px 10px rgba(220, 53, 69, 0.15);

                flex-shrink: 0;

            }

            .error-title {

                font-size: 18px; font-weight: 700; color: #a51d2a; 

                margin: 0; letter-spacing: -0.5px;

            }

            .error-modal-body {

                padding: 25px 30px;

        document.addEventListener('paste', function(e) {

            const modal = document.getElementById('imageEditorModal');

            

            // 1. SE O MODAL DE EDIÇÃO ESTIVER ABERTO -> COLA NO CANVAS

            if (modal.style.display === 'flex') {

                const items = (e.clipboardData || e.originalEvent.clipboardData).items;

                for (let index in items) {

                    const item = items[index];

                    if (item.kind === 'file' && item.type.includes('image/')) {

                        const blob = item.getAsFile();

                        const reader = new FileReader();

                        reader.onload = function(event) {

                            const img = new Image();

                            img.onload = function() {

                                // Salva estado antes de colar

                                saveState();

                                

                                // Limpa o canvas para receber a nova imagem limpa

                                ctx.clearRect(0, 0, canvas.width, canvas.height); 



                                // --- LÓGICA DE CENTRALIZAÇÃO E REDIMENSIONAMENTO (CONTAIN) ---

                                const canvasRatio = canvas.width / canvas.height;

                                const imgRatio = img.width / img.height;

                                

                                let drawWidth, drawHeight, offsetX, offsetY;



                                // Se a imagem for mais larga que o canvas (proporcionalmente)

                                if (imgRatio > canvasRatio) {

                                    drawWidth = canvas.width;

                                    drawHeight = canvas.width / imgRatio;

                                    offsetX = 0;

                                    offsetY = (canvas.height - drawHeight) / 2; // Centraliza verticalmente

                                } 

                                // Se a imagem for mais alta

                                else {

                                    drawHeight = canvas.height;

                                    drawWidth = canvas.height * imgRatio;

                                    offsetY = 0;

                                    offsetX = (canvas.width - drawWidth) / 2; // Centraliza horizontalmente

                                }



                                // Desenha a imagem centralizada

                                ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);

                            }

                            img.src = event.target.result;

                        }

                        reader.readAsDataURL(blob);

                        e.preventDefault(); // Impede comportamento padrão

                        break;

                    }

                }

        // --- LÓGICA DE ARRASTAR (MOVIMENTAÇÃO) ---

        box.onmousedown = function(e) {

            if(e.target.classList.contains('resize-handle') || e.target.tagName === 'BUTTON') return;

            

            isMoving = true;

            startX_Text = e.clientX - box.offsetLeft;

            startY_Text = e.clientY - box.offsetTop;

            

            document.onmousemove = function(e) {

                if(!isMoving) return;

                e.preventDefault();

                box.style.left = (e.clientX - startX_Text) + 'px';

                box.style.top = (e.clientY - startY_Text) + 'px';

            };

            

            document.onmouseup = function() {

                isMoving = false;

                document.onmousemove = null;

                document.onmouseup = null;

            };

        };

    // 2. Inicia o redimensionamento (pela bolinha azul)

    function initResize(e) {

        e.stopPropagation(); // Impede que o evento suba para o arrastar

        isResizing = true;

        

        const box = document.getElementById('mobileTextBox');

        const content = document.getElementById('mobileTextContent');

        

        startX_Text = e.clientX;

        startWidth = box.offsetWidth;

        startFontSize = parseFloat(window.getComputedStyle(content).fontSize);



        document.documentElement.addEventListener('mousemove', doResize, false);

        document.documentElement.addEventListener('mouseup', stopResize, false);

    }



    // 3. Executa o redimensionamento elástico

    function doResize(e) {

        if (!isResizing) return;

        

        const box = document.getElementById('mobileTextBox');

        const content = document.getElementById('mobileTextContent');



        // Calcula quanto o mouse andou

        const dx = e.clientX - startX_Text;

        

        // Aumenta a fonte proporcionalmente ao movimento

        let newFontSize = startFontSize + (dx * 0.5); 

        

        if (newFontSize < 10) newFontSize = 10; // Tamanho mínimo

        

        content.style.fontSize = newFontSize + 'px';

    }



    function stopResize() {

        isResizing = false;

        document.documentElement.removeEventListener('mousemove', doResize, false);

        document.documentElement.removeEventListener('mouseup', stopResize, false);

    }



    // 4. FINALIZA E "CARIMBA" O TEXTO NA IMAGEM (Correção de Posição)

    function finalizeText() {

        const box = document.getElementById('mobileTextBox');

        const content = document.getElementById('mobileTextContent');

        

        if (box.style.display === 'none') return;



        saveState(); // Salva para desfazer (Ctrl+Z)



        // 1. Pega os retângulos de posição na tela

        const boxRect = box.getBoundingClientRect();

        const canvasRect = canvas.getBoundingClientRect();



        // 2. Calcula a escala (caso o canvas visual seja diferente do tamanho real em pixels)

        const scaleX = canvas.width / canvasRect.width;

        const scaleY = canvas.height / canvasRect.height;



        // 3. Calcula a posição exata onde desenhar no Canvas

        // (Posição da Caixa na Tela - Posição do Canvas na Tela) * Escala

        const relativeX = (boxRect.left - canvasRect.left) * scaleX;

        const relativeY = (boxRect.top - canvasRect.top) * scaleY;



        // 4. Calcula o centro da caixa

        const boxWidth = boxRect.width * scaleX;

        const boxHeight = boxRect.height * scaleY;

        const centerX = relativeX + (boxWidth / 2);

        const centerY = relativeY + (boxHeight / 2);



        // 5. Configura a fonte

        const fontSize = parseFloat(window.getComputedStyle(content).fontSize) * scaleX;

        

        ctx.font = "bold " + fontSize + "px Arial";

        ctx.fillStyle = content.style.color;

        ctx.textAlign = "center";     // Centraliza horizontalmente

        ctx.textBaseline = "middle";  // Centraliza verticalmente



        // Desenha!

        ctx.fillText(content.innerText, centerX, centerY);



        // Esconde a caixa e volta para a ferramenta padrão

        box.style.display = 'none';

        setTool('pen');

    }

        // --- FUNÇÕES DE MÁSCARA E VALIDAÇÃO ---

        function setupInputMasks(section) {

            // Máscara de Data (xx/xx/xxxx)

            const dateInput = section.querySelector('.inp-data');

            if (dateInput) {

                // Remove o type="date" nativo para usar texto com máscara se preferir, ou força formato visual

                // Aqui assumimos input type="text" no HTML para controle total da máscara

                dateInput.addEventListener('input', function(e) {

                    let v = e.target.value.replace(/\D/g, '');

                    if (v.length > 2) v = v.replace(/^(\d{2})(\d)/, '$1/$2');

                    if (v.length > 5) v = v.replace(/^(\d{2})\/(\d{2})(\d)/, '$1/$2/$3');

                    e.target.value = v.slice(0, 10);

                });

            }



            // Máscara de CPF (XXX.XXX.XXX-XX)

            const cpfInput = section.querySelector('.inp-cpf');

            if (cpfInput) {

                cpfInput.addEventListener('input', function(e) {

                    let v = e.target.value.replace(/\D/g, '');

                    if (v.length > 3) v = v.replace(/^(\d{3})(\d)/, '$1.$2');

                    if (v.length > 6) v = v.replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');

                    if (v.length > 9) v = v.replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');

                    e.target.value = v.slice(0, 14);

                });

            }



            // Validação de Container (4 Letras + 7 Números)

            const containerInput = section.querySelector('.inp-container');

            if (containerInput) {

                containerInput.addEventListener('input', function(e) {

                    let v = e.target.value.toUpperCase();

                    // Permite digitar, mas valida no final ou restringe caracteres

                    // Regex simples: Primeiros 4 devem ser letras, restos números

                    if (v.length <= 4) {

                        e.target.value = v.replace(/[^A-Z]/g, '');

                    } else {

                        let prefix = v.slice(0, 4);

                        let suffix = v.slice(4).replace(/\D/g, '');

                        e.target.value = (prefix + suffix).slice(0, 11);

                    }

                });

            }

        }

        // --- FUNÇÃO AUXILIAR DE VALIDAÇÃO DE DATA ---

        function isValidDate(dateString) {

            if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dateString)) return false;

            

            const [day, month, year] = dateString.split('/').map(Number);

            const date = new Date(year, month - 1, day);

            

            // Verifica se a data é real (ex: 30/02)

            if (date.getFullYear() !== year || date.getMonth() + 1 !== month || date.getDate() !== day) return false;

            

            const now = new Date();

            now.setHours(0,0,0,0);

            

            // Regra: Não permitir futuro

            if (date > now) return false;

            

            // Regra: Não permitir mais que 4 anos atrás

            const minDate = new Date();

            minDate.setFullYear(now.getFullYear() - 4);

            if (date < minDate) return false;

            

            return true;

        }

        const existeTermoNaTela = document.querySelector('.report-section[data-type="termo"]') !== null;

        // 2. Itera sobre cada formulário aberto
        sections.forEach((section, index) => {
            const type = section.dataset.type;
            const subtype = section.querySelector('.inp-subtype') ? section.querySelector('.inp-subtype').value : type;
            
            // Título amigável para o erro
            const formName = `📝 Formulário ${index + 1} (${subtype.toUpperCase().replace('_', ' ')})`;
            let formErrors = [];

            // --- Helper interno para marcar erro ---
            const markError = (input, msg) => {
                if(input) input.classList.add('input-error'); // Adiciona borda vermelha
                formErrors.push(`   • ${msg}`); // Adiciona texto na lista
            };

            // --- A. Validação de Campos Comuns (Todos os formulários têm) ---
            const clienteInp = section.querySelector('.inp-cliente');
            const dataInp = section.querySelector('.inp-data');
            const containerInp = section.querySelector('.inp-container');
            const blInp = section.querySelector('.inp-bl');

            if (!clienteInp.value.trim()) markError(clienteInp, "Cliente é obrigatório");
            if (!blInp.value.trim()) markError(blInp, "BL é obrigatório");
            
            // Validação Container (4 letras + 7 números)
            if (!containerInp.value.trim()) {
                markError(containerInp, "Container é obrigatório");
            } else if (!/^[A-Z]{4}\d{7}$/.test(containerInp.value.trim())) {
                markError(containerInp, "Container inválido (Ex: ABCD1234567)");
            }

            // Validação Data (usa a função auxiliar checkDate)
            if (!dataInp.value.trim()) {
                markError(dataInp, "Data do Serviço é obrigatória");
            } else {
                const dateMsg = checkDate(dataInp.value.trim());
                if (dateMsg !== true) markError(dataInp, dateMsg);
            }

            // --- B. Validação Específica: TERMO DE FALTA/AVARIA ---
            if (type === 'termo') {
                const qtdInp = section.querySelector('.inp-qtd');
                if (!qtdInp.value.trim()) markError(qtdInp, "Qtd Avarias é obrigatória");
                
                // Verifica se pelo menos um checkbox foi marcado
                const checkboxes = section.querySelectorAll('.checkbox-grid input[type="checkbox"]:checked');
                if (checkboxes.length === 0) {
                    // Marca a caixa inteira dos checkboxes como erro
                    section.querySelector('.checkbox-grid').classList.add('input-error');
                    formErrors.push("Selecione pelo menos um Tipo de Avaria");
                }
            } 
            
            // --- C. Validação Específica: BAGAGEM ---
            else if (type === 'bagagem') {
                const lacreInp = section.querySelector('.inp-lacre');
                if (!lacreInp.value.trim()) markError(lacreInp, "Lacre é obrigatório");
                
                // Validação inteligente de CPF
                // Só valida se o campo estiver VISÍVEL na tela
                const cpfInp = section.querySelector('.inp-cpf');
                const colCpf = cpfInp ? cpfInp.closest('.col') : null;
                const isCpfVisible = colCpf && colCpf.style.display !== 'none';
                
                if (isCpfVisible) {
                    if (!cpfInp.value.trim()) {
                        markError(cpfInp, "CPF é obrigatório");
                    } else if (cpfInp.value.length < 14) {
                        markError(cpfInp, "CPF incompleto");
                    }
                }
          // === NOVA REGRA DE AVARIA ===
                const avariaSelect = section.querySelector('.inp-avaria');
                // Se marcou "Sim" E NÃO existe nenhum termo na tela
                if (avariaSelect && avariaSelect.value === "Sim" && !existeTermoNaTela) {
                    markError(avariaSelect, "Avaria marcada como 'SIM': É obrigatório adicionar um Termo de Avaria (use o botão 'Adicionar Sequência').");
                }
            }

            // Se houve erros neste formulário, adiciona ao relatório final
            if (formErrors.length > 0) {
                errors.push(`${formName}:\n${formErrors.join("\n")}`);
            }
        });

        return errors;
    }

    // --- FUNÇÃO AUXILIAR: VALIDAÇÃO DE DATA ---
    // Retorna 'true' se válido, ou uma 'string' com a mensagem de erro
    function checkDate(dateString) {
        // 1. Formato básico regex
        if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dateString)) return "Data inválida (use dd/mm/aaaa).";

        const [day, month, year] = dateString.split('/').map(Number);
        const date = new Date(year, month - 1, day);
        
        // 2. Data inexistente (ex: 30 de Fevereiro)
        if (date.getFullYear() !== year || date.getMonth() + 1 !== month || date.getDate() !== day) {
            return "Data inexistente no calendário.";
        }
        
        const now = new Date();
        now.setHours(0,0,0,0); // Zera hora para comparar apenas dias
        
        // 3. Regra: Não permitir data futura
        if (date > now) return "Data futura não permitida.";
        
        // 4. Regra: Não permitir data muito antiga (ex: mais de 4 anos atrás)
        const minDate = new Date(now);
        minDate.setFullYear(now.getFullYear() - 4); 

        if (date < minDate) return "Data muito antiga (limite de 4 anos).";

        return true;
    }

      function handleFileSelect(inputElement) {
    const files = inputElement.files;
    if (!files || files.length === 0) return;

    const slotAtual = inputElement.parentElement;
    const containerPrincipal = slotAtual.parentElement;
    
    // Pega todos os slots (divs)
    let listaSlots = Array.from(containerPrincipal.children).filter(el => el.tagName === 'DIV');
    const indiceInicial = listaSlots.indexOf(slotAtual);

    for (let i = 0; i < files.length; i++) {
        // Se precisar de mais slots, cria novos
        if ((indiceInicial + i) >= listaSlots.length) {
            criarNovoSlot(containerPrincipal);
            listaSlots = Array.from(containerPrincipal.children).filter(el => el.tagName === 'DIV');
        }

        const slotDestino = listaSlots[indiceInicial + i];
        const arquivo = files[i];
        
        // Elementos internos
        const imgTag = slotDestino.querySelector('img');
        const placeholder = slotDestino.querySelector('.placeholder');
        const btnEditar = slotDestino.querySelector('.edit-icon-btn');
        const btnExcluir = slotDestino.querySelector('.delete-icon-btn');

        const reader = new FileReader();
        
        // O SEGREDO ESTÁ AQUI: readAsDataURL cria um texto Base64
        reader.onload = function(e) {
            if (imgTag) {
                imgTag.src = e.target.result; // Isso é uma string longa (data:image/jpeg...)
                imgTag.style.display = 'block';
                // Adiciona marcação visual
                slotDestino.classList.add('has-image');
            }
            if (placeholder) placeholder.style.display = 'none';
            if (btnEditar) btnEditar.style.display = 'inline-block';
            if (btnExcluir) btnExcluir.style.display = 'inline-block';
        };
        
        reader.readAsDataURL(arquivo); // Converte para Base64
    }
}
function criarNovoSlot(container) {

    // 2. Faz uma cópia exata (clone) desse slot
    const novoSlot = slotModelo.cloneNode(true);

    // --- AGORA PRECISAMOS LIMPAR O NOVO SLOT (Pois ele vem com a foto do anterior) ---

    // A. Reseta o Input de arquivo
    const input = novoSlot.querySelector('input');
    if (input) input.value = ''; 

    // B. Reseta a Imagem (tira a foto clonada e esconde a tag)
    const img = novoSlot.querySelector('img');
    if (img) {
        img.src = '';
        img.style.display = 'none';
    }

    // C. Esconde os botões de editar/excluir (eles só devem aparecer quando tiver foto)
    const btnEditar = novoSlot.querySelector('.edit-icon-btn');
    const btnExcluir = novoSlot.querySelector('.delete-icon-btn');
    if (btnEditar) btnEditar.style.display = 'none';
    if (btnExcluir) btnExcluir.style.display = 'none';

    // D. Arruma o texto de fundo (Placeholder)
    const count = container.querySelectorAll('div').length + 1; // Conta quantos tem (filtro simples)
    const placeholder = novoSlot.querySelector('.placeholder');
    
    if (placeholder) {
        placeholder.style.display = 'block'; // Garante que o texto apareça
        // Recria o HTML interno para atualizar o número da "Foto X"
        placeholder.innerHTML = `<span>📷</span><br>Foto ${count}<br><small>2x Clique: Arquivo<br>Ctrl+V: Colar</small>`;
    }

    // 3. Adiciona o slot novinho e limpo ao container
    container.appendChild(novoSlot);
    
    return novoSlot;
}

                // Descontamos um pouco (padding) para não ficar colado na borda
                const availableWidth = container.clientWidth - 20;

                );

                // (Se for menor, mantemos o tamanho original ou aumentamos se quiser, aqui optei por manter a qualidade visual)
                if (scale < 1) {
                    newWidth = newWidth * scale;
                    newHeight = newHeight * scale;
                }

                // Define o tamanho do Canvas
                canvas.width = newWidth;
                canvas.height = newHeight;

                // Desenha a imagem redimensionada

                saveState();

            }

    // --- FUNÇÃO AUXILIAR: Pega posição X/Y (Mouse ou Toque) ---
    function getMousePos(evt) {
        const rect = canvas.getBoundingClientRect();
        
        // Verifica se é evento de toque (celular) ou mouse (PC)
        // Se for toque, pega o primeiro dedo (touches[0])
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    // --- INICIALIZADOR DE EVENTOS (ATUALIZADO PARA TOUCH) ---
    function initCanvasEvents() {
        // Clona o canvas para limpar eventos anteriores (evita duplicação)
        const newCanvas = canvas.cloneNode(true);
        canvas.parentNode.replaceChild(newCanvas, canvas);
        canvas = newCanvas;
        ctx = canvas.getContext('2d');
        
        // Restaura a imagem que estava desenhada
        const img = new Image();
        if(canvasHistory.length > 0) {
            img.src = canvasHistory[canvasHistory.length-1];
        } else {
            img.src = imgObj.src;
        }
        
        img.onload = function() { 
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0); 
        }

        // --- Eventos de Mouse (Computador) ---
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // --- Eventos de Toque (Celular/Tablet) ---
        // 'passive: false' é obrigatório para o preventDefault funcionar e a tela não rolar
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
        canvas.addEventListener('touchend', stopDrawing, { passive: false });
    }

    function startDrawing(e) {

        // Se clicar nos controles da caixa de texto, não faz nada (deixa o controle agir)

        if (e.target.closest('.resizable-text-box')) return;



        const pos = getMousePos(e);

        startX = pos.x;

        startY = pos.y;

        isDrawing = true;



        // --- LÓGICA DE TEXTO ---

        if (currentTool === 'text') {

            isDrawing = false; 

            

            const container = document.querySelector('.editor-canvas-container');

            // Calcula posição do clique relativo ao container visual

            const clickX = e.clientX - rect.left;

            const clickY = e.clientY - rect.top;

            

            // Cria/Move a caixa para onde clicou

            spawnTextBox(clickX - 50, clickY - 20); 

            return;

        }

        // ----------------------



        if (!isCropping) {

            ctx.beginPath();

            ctx.moveTo(startX, startY);

            ctx.strokeStyle = currentColor;

            ctx.lineWidth = 5; 

            ctx.lineCap = 'round';

            ctx.lineJoin = 'round';

        }

    }



        function draw(e) {

            if (!isDrawing) return;

            const pos = getMousePos(e);



            if (currentTool === 'pen') {

                ctx.lineTo(pos.x, pos.y);

                ctx.stroke();

            } else if (currentTool === 'ellipse') {

                restoreState(); 

                ctx.beginPath();

                let radiusX = Math.abs(pos.x - startX) / 2;

                let radiusY = Math.abs(pos.y - startY) / 2;

                let centerX = Math.min(pos.x, startX) + radiusX;

                let centerY = Math.min(pos.y, startY) + radiusY;

                ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, 2 * Math.PI);

                ctx.strokeStyle = currentColor;

                ctx.lineWidth = 5;

                ctx.stroke();

            } else if (isCropping) {

                restoreState();

                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';

                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const w = pos.x - startX;

                const h = pos.y - startY;

                ctx.clearRect(startX, startY, w, h);

                ctx.strokeStyle = 'white';

                ctx.lineWidth = 2;

                ctx.setLineDash([10, 5]);

                ctx.strokeRect(startX, startY, w, h);

                ctx.setLineDash([]);

            }

        }



        function stopDrawing(e) {

            if (!isDrawing) return;

            isDrawing = false;

            

            if (isCropping) {

                const pos = getMousePos(e);

                let w = pos.x - startX;

                let h = pos.y - startY;

                const finalX = w < 0 ? pos.x : startX;

                const finalY = h < 0 ? pos.y : startY;

                const finalW = Math.abs(w);

                const finalH = Math.abs(h);



                if (finalW > 20 && finalH > 20) {

                    const tempImg = new Image();

                    tempImg.src = canvasHistory[canvasHistory.length - 1] || imgObj.src;

                    tempImg.onload = function() {

                        canvas.width = finalW;

                        canvas.height = finalH;

                        ctx.drawImage(tempImg, finalX, finalY, finalW, finalH, 0, 0, finalW, finalH);

                        saveState(); 

                        isCropping = false;

                        setTool('pen'); 

                    };

                } else {

                    restoreState(); 

                }

            } else {

                saveState();

            }

        }



        function saveState() {

            if (canvasHistory.length > 10) canvasHistory.shift(); 

            canvasHistory.push(canvas.toDataURL());

        }



        function restoreState() {

            if (canvasHistory.length > 0) {

                const img = new Image();

                img.src = canvasHistory[canvasHistory.length - 1];

                ctx.drawImage(img, 0, 0);

            }

        }



        function undoLast() {

            if (canvasHistory.length > 1) {

                canvasHistory.pop(); 

                const prevImgState = canvasHistory[canvasHistory.length - 1];

                const img = new Image();

                img.src = prevImgState;

                img.onload = function() {

                    canvas.width = img.width;

                    canvas.height = img.height;

                    ctx.drawImage(img, 0, 0);

                };

            } else if (canvasHistory.length === 1) {

                canvasHistory = [];

                canvas.width = imgObj.width; 

                canvas.height = imgObj.height;

                ctx.drawImage(imgObj, 0, 0, imgObj.width, imgObj.height);

                saveState(); 

            }

        }

                    // Captura valores base (Maiúsculas e limpos)

                    const container = firstSection.querySelector('.inp-container').value.toUpperCase().trim() || "CONTAINER";
                    const bl = firstSection.querySelector('.inp-bl').value.toUpperCase().trim() || "BL";
                    
                    // Remove caracteres proibidos para nome de arquivo
                    const safeCliente = cliente.replace(/[<>:"/\\|?*]/g, '');
                    
                    let prefixo = "RELATORIO";
                    const type = firstSection.dataset.type;

                    // --- DETECÇÃO DO CONTEXTO GERAL ---
                    // Varre todas as seções para saber o que temos na tela
                    const allSections = document.querySelectorAll('.report-section');
                    let hasDesova = false;
                    let hasOvacao = false;
                    let hasTermo = false;

                    allSections.forEach(sec => {
                        const sub = sec.querySelector('.inp-subtype')?.value;
                        if (sub === 'desova') hasDesova = true;
                        if (sub === 'ovacao') hasOvacao = true;
                        if (sec.dataset.type === 'termo') hasTermo = true;
                    });

                    // --- APLICAÇÃO DAS REGRAS ---
                    if (type === 'termo') {
                        prefixo = "TFA"; 
                    } 
                    else if (type === 'bagagem') {
                        
                        // REGRA MAIOR: Se tem DESOVA + OVAÇÃO juntos
                        if (hasDesova && hasOvacao) {
                            prefixo = "RELATÓRIO DE BAGAGEM";
                        } 
                        else {
                            // REGRA ESPECÍFICA (Apenas um tipo na tela)
                            const subtype = firstSection.querySelector('.inp-subtype')?.value || "";
                            let nomeTipo = "BAGAGEM"; 

                            if (subtype === 'desova') nomeTipo = "DESOVA";
                            else if (subtype === 'ovacao') nomeTipo = "OVAÇÃO";
                            else if (subtype === 'bagagem_avaria') nomeTipo = "AVARIA";

                            // Verifica se deve adicionar "E TFA"
                            // Condição: Checkbox "Sim" E Seção de Termo presente
                            const checkboxAvariaSim = firstSection.querySelector('.inp-avaria')?.value === "Sim";

                            if (checkboxAvariaSim && hasTermo) {
                                nomeTipo += " E TFA";
                            }

                            prefixo = `RELATÓRIO DE BAGAGEM - ${nomeTipo}`;
                        }
                    }

                    // Formato Final: PREFIXO - CLIENTE - BL - CONTAINER
                    finalFileName = `${prefixo} - ${safeCliente} - ${bl} - ${container}.pdf`;
                }
                // -----------------------------------------------------------
                // 4. GERAÇÃO DO CONTEÚDO HTML (PÁGINAS)
                // -----------------------------------------------------------
                const sections = document.querySelectorAll('.report-section');

                for (let section of sections) {
                    const type = section.dataset.type; 
                    const subtype = section.querySelector('.inp-subtype') ? section.querySelector('.inp-subtype').value : "";
                    
                    const data = {
                        cliente: section.querySelector('.inp-cliente').value.toUpperCase(),
                        data: section.querySelector('.inp-data').value, 
                        container: section.querySelector('.inp-container').value.toUpperCase(),
                        bl: section.querySelector('.inp-bl').value.toUpperCase(),
                        obs: section.querySelector('.inp-obs').value
                    };

    }

                        if(subtype === 'desova') title = "RELATÓRIO DE BAGAGEM - DESOVA";
                        else if(subtype === 'ovacao') title = "RELATÓRIO DE BAGAGEM - OVAÇÃO";

                    } else {
                        title = "TERMO DE AVARIA E/OU FALTA";
                        // Gera páginas de Termo
                        await createReportPages(title, createTermoHTML(section, data), photos, printArea, false);
                    }
                }

                // -----------------------------------------------------------
                // 5. CONVERSÃO HTML -> PDF (JSPDF + HTML2CANVAS)
                // -----------------------------------------------------------
                // Pequeno delay para garantir que o DOM renderizou as imagens
               await new Promise(r => setTimeout(r, 2000)); 

                const pdf = new jsPDF('p', 'mm', 'a4');
                const pages = document.querySelectorAll(".pdf-page");
                
                if (pages.length === 0) {
                    throw new Error("Nenhuma página foi gerada. Verifique os formulários.");
                }

                for (let i = 0; i < pages.length; i++) {
                    // Renderiza a div oculta como imagem
                    const canvas = await html2canvas(pages[i], { 
                        scale: 1.5, // Qualidade (1.5x é bom equilíbrio performance/qualidade)
                        useCORS: true, // Permite carregar imagens externas se necessário
                        logging: false 
                    });

                    const imgData = canvas.toDataURL('image/jpeg', 0.80); // Compressão JPEG 80%
                    const pdfWidth = 210; // A4 largura mm
                    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

                    if (i > 0) pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                }

                // Salva o arquivo
                pdf.save(finalFileName);

            } catch (err) {
                console.error(err);
                alert("Ocorreu um erro ao gerar o PDF:\n" + err.message);
            } finally {
                // Restaura o botão
                btn.innerText = originalText;
                btn.disabled = false;
                printArea.innerHTML = ""; 
                
                // --- NOVO: Limpa o rascunho automático após sucesso ---
                localStorage.removeItem(STORAGE_KEY); 
            }

        function createBagagemHTML(section, data, subtype) {

            let labelLacre = "LACRE";

            if(subtype === 'desova') labelLacre = "LACRE DE ORIGEM";

            if(subtype === 'ovacao') labelLacre = "LACRE DO TERMINAL";



            const lacre = section.querySelector('.inp-lacre').value.toUpperCase();

            const cpf = section.querySelector('.inp-cpf').value;

            const avaria = section.querySelector('.inp-avaria').value === "Sim" ? "[ X ]" : "[   ]";

            const acomp = section.querySelector('.inp-acomp').value === "Sim" ? "[ X ]" : "[   ]";

            const mercadoria = "BAGAGEM";



            const getList = (idx) => {

                const container = section.querySelectorAll('.container-staff')[idx];

                return Array.from(container.querySelectorAll('input'))

                    .map(i => i.value.toUpperCase())

                    .filter(v=>v)

                    .map(n => `<div style="margin-bottom:2px;">${n}</div>`)

                    .join("");

            };

            const conf = getList(0) || "&nbsp;";

            const oper = getList(1) || "&nbsp;";

            const aux = getList(2) || "&nbsp;";



            const cpfRow = (subtype !== 'bagagem_avaria') ? `<tr><td class="label-cell">CPF:</td><td class="value-cell">${cpf}</td></tr>` : "";



            return `

            <table class="master-table">

                <tr>

                    <td class="col-left" style="height: 1px;"> 

                        <table class="inner-data-table" style="height: 100%;">

                            <tr><td class="label-cell">CLIENTE:</td><td class="value-cell">${data.cliente}</td></tr>

                            ${cpfRow}

                            <tr><td class="label-cell">CONTAINER:</td><td class="value-cell">${data.container}</td></tr>

                            <tr><td class="label-cell">MERCADORIA:</td><td class="value-cell">${mercadoria}</td></tr>

                            <tr><td class="label-cell">DATA DO SERVIÇO:</td><td class="value-cell">${data.data}</td></tr>

                            <tr><td class="label-cell">BL:</td><td class="value-cell">${data.bl}</td></tr>

                            <tr><td class="label-cell">${labelLacre}:</td><td class="value-cell">${lacre}</td></tr>

                            <tr><td class="label-cell">HOUVE AVARIA?</td><td class="value-cell checkbox-pdf">${avaria}</td></tr>

                            <tr><td class="label-cell">ACOMPANHAMENTO?</td><td class="value-cell checkbox-pdf">${acomp}</td></tr>

                        </table>

                    </td>

                    

                    <td class="col-right" style="height: 1px;"> 

                        <table class="team-table" style="height: 100%;">

                            <tr style="height: 20px;"><td colspan="2" class="team-header-cell">PESSOAS QUE ACOMPANHARAM:</td></tr>

                            <tr style="height: 18px;"><td class="team-sub-header" style="width:40%;">CARGO</td><td class="team-sub-header">PESSOAS</td></tr>

                            

                            <tr style="height: 1px;"><td class="team-role-cell">CONFERENTE</td><td class="team-names-cell" style="vertical-align: top;">${conf}</td></tr>

                            <tr style="height: 1px;"><td class="team-role-cell">OP. EMPILHADEIRA</td><td class="team-names-cell" style="vertical-align: top;">${oper}</td></tr>

                            

                            <tr class="row-auxiliares">

                                <td class="team-role-cell cell-auxiliares">AUXILIARES</td>

                                <td class="team-names-cell cell-auxiliares">${aux}</td>

                            </tr>

                        </table>

                    </td>

                </tr>

                <tr>

                    <td colspan="2" style="border-top: 1px solid #000; padding: 10px; font-size: 14px; text-align: left;">

                        ${data.obs}

                    </td>

                </tr>

            </table>`;

        }



        function createTermoHTML(section, data) {

            // Agora busca o valor do select de Serviço

            const servico = section.querySelector('.inp-servico').value.toUpperCase();

            const qtd = section.querySelector('.inp-qtd').value;

            let avariasLi = "";

            

            // Pega os checkboxes normais

            const checkboxes = section.querySelectorAll('.checkbox-grid input[type="checkbox"]:checked');

            checkboxes.forEach(cb => { 

                // Se for o checkbox "Outro", pega o valor do input de texto ao lado

                if (cb.value === "OUTRO") {

                    const otherText = section.querySelector('.inp-other-avaria').value.toUpperCase();

                    if(otherText) avariasLi += `<li>${otherText}</li>`;

                } else {

                    avariasLi += `<li>${cb.value}</li>`; 

                }

            });

            

            // Preenchimento de linhas vazias para layout

            for(let i=checkboxes.length; i<6; i++) { avariasLi += `<li>&nbsp;</li>`; }



            return `

            <table class="master-table">

                <tr>

                    <td class="col-left">

                        <table class="inner-data-table">

                            <tr><td class="label-cell">CLIENTE:</td><td class="value-cell">${data.cliente}</td></tr>

                            <tr><td class="label-cell">DATA:</td><td class="value-cell">${data.data}</td></tr>

                            <tr><td class="label-cell">CONTAINER:</td><td class="value-cell">${data.container}</td></tr>

                            <tr><td class="label-cell">BL:</td><td class="value-cell">${data.bl}</td></tr>

                            <tr><td class="label-cell">SERVIÇO:</td><td class="value-cell">${servico}</td></tr>

                            <tr><td class="label-cell">QTD AVARIAS:</td><td class="value-cell">${qtd}</td></tr>

                        </table>

                        <div class="obs-cell-left" style="border-top:1px solid #000; font-size: 14px;">${data.obs}</div>

                    </td>

                    <td class="col-right" rowspan="2">

                        <div class="right-header">TIPO DE AVARIA</div>

                        <ul class="avaria-list">${avariasLi}</ul>

                    </td>

                </tr>

            </table>`;

        }



        function createPhotoGrid(photos) {
    const table = document.createElement("table");
    table.className = "photo-grid-table";

    // Loop de par em par
    for (let i = 0; i < photos.length; i += 2) {
        let tr = document.createElement("tr");

        // FOTO 1 (Esquerda)
        let td1 = document.createElement("td");
        if (photos[i]) {
            let img1 = document.createElement("img");
            img1.src = photos[i]; // Já é Base64, só atribuir
            td1.appendChild(img1);
        }
        tr.appendChild(td1);

        // FOTO 2 (Direita)
        let td2 = document.createElement("td");
        if (photos[i+1]) {
            let img2 = document.createElement("img");
            img2.src = photos[i+1]; // Já é Base64, só atribuir
            td2.appendChild(img2);
        } else {
            td2.innerHTML = "&nbsp;"; // Espaço vazio se for ímpar
        }
        
        tr.appendChild(td2);
        table.appendChild(tr);
    }
    return table;
}

    function saveToLocal() {
        const sections = document.querySelectorAll('.report-section');
        const dataToSave = [];

        sections.forEach(section => {
            const type = section.dataset.type;
            const subtype = section.querySelector('.inp-subtype')?.value || "";
            
            // Coleta dados dos inputs de texto básicos
            const sectionData = {
                type: type,
                subtype: subtype,
                values: {
                    cliente: section.querySelector('.inp-cliente')?.value || "",
                    data: section.querySelector('.inp-data')?.value || "",
                    container: section.querySelector('.inp-container')?.value || "",
                    bl: section.querySelector('.inp-bl')?.value || "",
                    lacre: section.querySelector('.inp-lacre')?.value || "",
                    cpf: section.querySelector('.inp-cpf')?.value || "",
                    obs: section.querySelector('.inp-obs')?.value || "",
                    avaria: section.querySelector('.inp-avaria')?.value || "",
                    acomp: section.querySelector('.inp-acomp')?.value || "",
                    servico: section.querySelector('.inp-servico')?.value || "",
                    qtd: section.querySelector('.inp-qtd')?.value || ""
                },
                // Coleta Checkboxes (para Termo de Avaria)
                checkboxes: [],
                // Coleta Equipe (Conferente, etc - apenas texto)
                staff: []
            };

            // Salva Checkboxes marcados
            section.querySelectorAll('.checkbox-grid input[type="checkbox"]:checked').forEach(cb => {
                sectionData.checkboxes.push(cb.value);
            });
            // Salva texto do campo "Outro" nas avarias
            const otherInput = section.querySelector('.inp-other-avaria');
            if(otherInput) sectionData.values.otherAvaria = otherInput.value;

            // Salva nomes da equipe
            section.querySelectorAll('.staff-input').forEach(inp => {
                sectionData.staff.push(inp.value);
            });

            dataToSave.push(sectionData);
        });

        // Salva no navegador (Converte Objeto -> Texto JSON)
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
        
        // (Opcional) Visual feedback no console
        // console.log("Rascunho salvo automático às " + new Date().toLocaleTimeString());
    }

    // 2. Função para CARREGAR (RESTAURAR) o estado
    function restoreFromLocal() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (!savedData) return; // Nada salvo, não faz nada

        try {
            const parsedData = JSON.parse(savedData);
            if (parsedData.length === 0) return;

            // Pergunta ao usuário se ele quer restaurar
            if (!confirm("Encontrei um relatório não finalizado anteriormente. Deseja recuperar os dados?")) {
                localStorage.removeItem(STORAGE_KEY); // Se não quiser, limpa
                return;
            }

            // 1. Limpa a tela atual e esconde menu inicial
            document.getElementById("reports-container").innerHTML = "";
            document.getElementById("mainForm").style.display = "block";
            document.getElementById("row-tipo-especifico").style.display = "flex"; // Ajuste visual

            // 2. Recria as seções
            parsedData.forEach(item => {
                // Reutiliza sua função 'addSection' existente
                // Nota: Precisamos passar o subtipo correto
                
                // Determina qual parametro passar para addSection
                let addParam = item.type; 
                if (item.type === 'bagagem' && item.subtype) addParam = item.subtype;
                if (item.type === 'termo') addParam = 'termo'; // ou 'avaria' dependendo da sua logica

                // Cria a seção visualmente
                addSection(addParam, false, item.subtype);

                // Pega a seção recém criada (a última adicionada)
                const sections = document.querySelectorAll('.report-section');
                const currentSection = sections[sections.length - 1];

                if (currentSection) {
                    // Preenche Inputs de Texto
                    for (const [key, value] of Object.entries(item.values)) {
                        const input = currentSection.querySelector(`.inp-${key}`);
                        if (input) input.value = value;
                    }
                    // Preenche "Outro" avaria
                    if(item.values.otherAvaria) {
                        const otherInp = currentSection.querySelector('.inp-other-avaria');
                        if(otherInp) otherInp.value = item.values.otherAvaria;
                    }

                    // Restaura Checkboxes
                    if (item.checkboxes && item.checkboxes.length > 0) {
                        item.checkboxes.forEach(val => {
                            const cb = currentSection.querySelector(`input[type="checkbox"][value="${val}"]`);
                            if (cb) cb.checked = true;
                            // Ativa o input "outro" se necessário
                            if (val === "OUTRO") toggleOtherAvaria(cb);
                        });
                    }

                    // Restaura Equipe (Staff)
                    // Nota: Sua lógica cria inputs dinamicamente, aqui vamos tentar preencher os existentes
                    // ou criar novos se necessário. Para simplificar, vamos preencher os vazios.
                    const staffInputs = currentSection.querySelectorAll('.staff-input');
                    item.staff.forEach((name, index) => {
                        // Se existir input, preenche. Se não (ex: adicionou + gente), teria que criar.
                        // Simplificação: preenche os slots padrão disponíveis.
                        if (staffInputs[index]) staffInputs[index].value = name;
                    });
                }
            });

        } catch (e) {
            console.error("Erro ao restaurar backup:", e);
        }
    }

    // 3. ATIVADORES (Triggers)
    
    // Salva sempre que o usuário digitar algo ou clicar
    document.addEventListener('input', saveToLocal);
    document.addEventListener('change', saveToLocal);

    // Tenta restaurar ao abrir a página
    window.addEventListener('DOMContentLoaded', () => {
        // Pequeno delay para garantir que o HTML carregou
        setTimeout(restoreFromLocal, 500);
    });

    // Limpa o storage APÓS gerar o PDF com sucesso (Opcional, mas recomendado)
    // Você deve adicionar 'localStorage.removeItem(STORAGE_KEY);' dentro do 'finally' da sua função generateAllPDFs

    </script>
